# Eureka configuration for TPickUp task
# LLM-based reward function generation and iteration

# Task configuration
task: "TPickUpDirectControl"

tasks:
  TPickUpDirectControl:
    name: "Pick Up Cube with Direct Joint Control"
    description: "Pick up a cube and hold it at y = 1.5 for 3 seconds using direct joint control (no IK) - robot must navigate to cube, grasp it, and hold it at target height"
    agent_file: "C:/Users/Kontor/Github Repos/AR4/Assets/Scripts/ml/RobotAgentTPickUpDirectControl.cs"
    unity_build: "C:/Users/Kontor/Github Repos/AR4/Builds/TPickUpDirectControl/AR4.exe"
    training_steps: 1000000
    max_episode_steps: 800

# Eureka iteration settings
iterations: 4  # Number of Eureka iterations
samples: 5     # Number of reward function candidates per iteration

# LLM settings
model: "o4-mini"
temperature: 1.0

max_episode_steps: 800
seed: 0
no_graphics: false

# PPO hyperparameters (for evaluating each reward candidate)
training:
  algorithm: "PPO"
  learning_rate: 0.0003  # 3e-4
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "Tanh"
  verbose: 1
  device: "auto"

# Logging settings
logging:
  tensorboard: true
  save_frequency: 10000  # Save checkpoints every N steps
  use_aggregation: true  # Unity stats logging mode
  stats_aggregation_interval: 5000

# Output paths (will be created with timestamp)
paths:
  output_dir: "C:/Users/Kontor/AppData/LocalLow/DefaultCompany/AR4/EurekaRewards/"