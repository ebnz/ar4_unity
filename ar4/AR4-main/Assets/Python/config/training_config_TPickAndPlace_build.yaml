# Simple training configuration for Unity AR4 robot
# This config is used for connecting to Unity Editor (not launching builds)
# Just run this script while Unity Editor is in Play mode

# Task configuration (optional - if not specified, uses settings below)
task: "TPickAndPlace"

# Task definitions (same structure as Eureka config)
tasks:
  TPickAndPlace:
    name: "Pick And Place"
    description: "Pick up a cube from a fixed location and transfer it to another fixed drop zone"
    agent_file: "C:/Users/Kontor/Github Repos/AR4/Assets/Scripts/ml/RobotAgentTPickAndPlace.cs"
    unity_build: "C:/Users/Kontor/Github Repos/AR4/Builds/TPickAndPlace/AR4.exe"

# Training settings
max_training_steps: 2000000
max_episode_steps: 800
seed: 0

# Optional: custom reward function
# If null, uses the reward function defined in Unity editor
reward_file: "C:/Users/Kontor/Github Repos/AR4/Assets/Scripts/rewards/reward_TPickAndPlace.txt"

# PPO hyperparameters
training:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.98
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "Tanh"  # or "ReLU"
  verbose: 1
  device: "auto"

# Logging settings
logging:
  tensorboard: true
  save_frequency: 100000  # Save model checkpoints every N steps
  use_aggregation: true  # Unity stats logging mode (true = aggregated checkpoints, false = individual episodes)
  stats_aggregation_interval: 5000  # Unity episode stats aggregation interval (only used if use_aggregation is true)

# Output paths
paths:
  output_dir: null  # defaults to platform-specific location if null