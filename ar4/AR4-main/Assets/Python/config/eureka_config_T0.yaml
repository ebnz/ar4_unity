# Eureka configuration for Unity AR4 robot tasks

# General settings
model: gpt-4.1  # or gpt-3.5-turbo for faster/cheaper iteration
temperature: 1.0
iterations: 3
samples: 4  # Number of reward functions to generate per iteration

# Task configurations
tasks:
  T0:
    name: "Move to Target"
    description: "Move the robot end effector to reach a fixed target position"
    success_threshold: 0.1
    max_episode_steps: 2000
    training_steps: 100000
    agent_file: "C:/Users/fabia/AR4/Assets/Scripts/ml/RobotAgentT0.cs"
    unity_build: "C:/Users/fabia/AR4/Builds/T0/AR4.exe"

# Logging settings
logging:
  tensorboard: true
  save_frequency: 10000  # Save model checkpoints every N steps

training:
  algorithm: "PPO"
  learning_rate: 0.0003  # 3e-4
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "Tanh"
  verbose: 1
  device: "auto"

# Paths
paths:
  output_dir: "C:/Users/fabia/AppData/LocalLow/DefaultCompany/AR4/EurekaRewards/"